spring:
  application:
    name: demo

  datasource:
    # url: jdbc:postgresql://---your db uri
    # username: ----your usrname ----
    # password: ---your pass ----
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 300000 # 5 minutes
      idle-timeout: 60000 # 1 minute
      keepalive-time: 30000 # prevents Neon idle close
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

